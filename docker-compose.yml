# FlightDeck for InterSystems IRIS. Usage: docker compose up -d
#   Port conflict:      FLIGHTDECK_PORT=52790 docker compose up -d
#   IRIS for Health:    IRIS_IMAGE=intersystemsdc/irishealth-community:2026.2-zpm docker compose up -d --build
services:
  iris:
    build:
      context: .
      args:
        IRIS_IMAGE: ${IRIS_IMAGE:-intersystemsdc/iris-community:2026.2-zpm}
    image: iris-flightdeck:local
    environment:
      FLIGHTDECK_PORT: ${FLIGHTDECK_PORT:-52780}
    ports:
      # Bound to localhost by default. FlightDeck is an administration portal and this install signs
      # in with the Community image's documented default account, so publishing it on every interface
      # puts that on whatever network the machine can reach — which is harmless on a laptop and is
      # not harmless on a machine with a public address. Local use is unchanged: the portal is at
      # http://localhost:52780/flightdeck/ either way.
      #
      # To publish deliberately, set the bind address:
      #   FLIGHTDECK_BIND=0.0.0.0 docker compose up -d
      # and read "Putting it on a network" in the README first: change the password, and put it
      # behind something that terminates TLS.
      - "${FLIGHTDECK_BIND:-127.0.0.1}:${FLIGHTDECK_PORT:-52780}:52773"
    volumes:
      - flightdeck-data:/durable
    restart: unless-stopped

volumes:
  flightdeck-data:
