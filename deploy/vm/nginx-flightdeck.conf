# Reverse proxy for the published demo (feature 007, items 2 to 4).
#
# The rule this file exists to enforce: the portal is reachable at the root, and NOTHING ELSE of IRIS
# is reachable at all. The instance behind it is a full IRIS with its own management portal at
# /csp/sys and its management APIs at /api/admin and /api/mgmnt; on a public address those are the
# whole attack surface, so the proxy forwards an allow-list and answers 404 to everything else.
#
# 404 rather than 403: a refusal that distinguishes "exists but forbidden" from "not here" tells a
# stranger which paths are worth attacking.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The demo is a browser application; nothing here accepts an upload.
    client_max_body_size 1m;

    # Do not advertise the version to someone deciding whether to bother.
    server_tokens off;

    # The portal itself, served at the root. The SPA is built with /flightdeck/ as its base, so the
    # root is rewritten into it rather than the bundle being rebuilt for a different base.
    location = / {
        return 302 /flightdeck/;
    }

    # The two paths FlightDeck actually owns, and no others.
    location /flightdeck/ {
        proxy_pass http://127.0.0.1:52780/flightdeck/;
        include /etc/nginx/flightdeck-proxy-headers.conf;

        # The instance is destroyed and rebuilt every hour, which takes about half a minute. A
        # visitor who arrives in that window used to get IRIS's own Apache 404 — a bare "Not Found"
        # on a demo whose entire job is to be looked at. Intercepting is safe here because the SPA
        # answers index.html for every path under /flightdeck/, so a 404 from it is never legitimate.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @rebuilding;
    }

    location /api/flightdeck/ {
        proxy_pass http://127.0.0.1:52780/api/flightdeck/;
        include /etc/nginx/flightdeck-proxy-headers.conf;
        # The API is not intercepted: its 404s and 403s are answers the portal needs to see.
    }

    # Shown while the hourly rebuild is running.
    location @rebuilding {
        default_type text/html;
        add_header Retry-After 30 always;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="10"><title>FlightDeck demo is rebuilding</title><style>body{font-family:system-ui,sans-serif;background:#12151a;color:#e6e9ef;margin:0;display:grid;place-items:center;height:100vh}main{max-width:34rem;padding:2rem;line-height:1.5}h1{font-size:1.25rem;font-weight:500}p{color:#9aa4b2}code{color:#e6e9ef}</style></head><body><main><h1>The demo is rebuilding.</h1><p>This instance is destroyed and rebuilt from nothing every hour, so that everyone who opens it finds the same clean state. It takes about half a minute.</p><p>This page reloads itself. If you would rather not wait, the one-command install in the README gives you an instance of your own.</p></main></body></html>';
    }

    # Everything else on the instance: the native management portal, the SysAdmin API, the
    # management API, the demo CSP applications, static IRIS content. Not reachable from outside.
    location / {
        return 404;
    }
}
